# Light support chrome, PlayStation Blue and documented Arial fallback for SST. Use input/card radii for compact desktop controls; CTA pills are not a global radius.
name = "PlayStation"
mode = "light"
"font.family" = "Arial"
"font.size" = 16
radius = 4
"radius.lg" = 8
shadow = false

[colors]
background = "#ffffff"
foreground = "#121314"
border = "#cccccc"
"input.border" = "#6b6b6b"
ring = "#0070d1"
caret = "#0064b7"
