# OpenCode DESIGN.md: warm paper, ink controls, and a monospaced interface.
name = "OpenCode"
mode = "light"
"font.family" = "Menlo" # Berkeley Mono is proprietary; Menlo is the macOS mono fallback.
"mono_font.family" = "Menlo"
"font.size" = 14
radius = 4
"radius.lg" = 4
shadow = false

