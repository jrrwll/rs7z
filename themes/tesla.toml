# Tesla DESIGN.md: white canvas, carbon text, restrained electric-blue action.
name = "Tesla"
mode = "light"
"font.family" = ".SystemUIFont" # Universal Sans is proprietary.
"font.size" = 14
radius = 4
"radius.lg" = 12
shadow = false

[colors]
background = "#ffffff"
foreground = "#171a20"
border = "#d0d1d2"
"input.border" = "#b8b9ba"
ring = "#3e6ae1"
caret = "#3e6ae1"
"primary.background" = "#3e6ae1"
"primary.foreground" = "#ffffff"
"primary.hover.background" = "#345bc5"
"primary.active.background" = "#2c4da7"
"accent.background" = "#e9edfa"
"accent.foreground" = "#171a20"
"selection.background" = "#3e6ae133"
link = "#3158bf"
"link.hover" = "#28499f"
"link.active" = "#203a81"
"drag.border" = "#3e6ae1"
"drop_target.background" = "#3e6ae11a"
"secondary.background" = "#f4f4f4"
"secondary.foreground" = "#393c41"
"secondary.hover.background" = "#eaeaea"
"secondary.active.background" = "#dedede"
"muted.background" = "#f4f4f4"
"muted.foreground" = "#5c5e62"
