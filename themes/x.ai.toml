# x.ai DESIGN.md: near-black canvas, white primary action, quiet charcoal chrome.
name = "x.ai"
mode = "dark"
"font.family" = ".SystemUIFont" # universalSans is proprietary.
"font.size" = 16
radius = 8
"radius.lg" = 8
shadow = false

[colors]
background = "#0a0a0a"
foreground = "#ffffff"
border = "#363a3f"
"input.border" = "#555a60"
ring = "#a0c3ec"
caret = "#ffffff"
"primary.background" = "#ffffff"
"primary.foreground" = "#0a0a0a"
"primary.hover.background" = "#dadbdf"
"primary.active.background" = "#bfc1c6"
"accent.background" = "#363a3f"
"accent.foreground" = "#ffffff"
"selection.background" = "#ffffff44"
link = "#a0c3ec"
"link.hover" = "#c7dcf4"
"link.active" = "#e0ebfa"
"drag.border" = "#ffffff"
"drop_target.background" = "#ffffff22"
"secondary.background" = "#1a1c20"
"secondary.foreground" = "#dadbdf"
"secondary.hover.background" = "#282b30"
"secondary.active.background" = "#363a3f"
"muted.background" = "#1a1c20"
"muted.foreground" = "#a6a9ad" # Brighter than website captions for dense file metadata.
"button.background" = "#1a1c20"
"button.foreground" = "#dadbdf"
"button.hover.background" = "#282b30"
"button.active.background" = "#363a3f"
"sidebar.background" = "#1a1c20"
"sidebar.foreground" = "#ffffff"
"sidebar.border" = "#363a3f"
"sidebar.accent.background" = "#ffffff"
"sidebar.accent.foreground" = "#0a0a0a"
"sidebar.primary.background" = "#ffffff"
"sidebar.primary.foreground" = "#0a0a0a"
"popover.background" = "#191919"
"popover.foreground" = "#ffffff"
"group_box.background" = "#191919"
"group_box.foreground" = "#ffffff"
"group_box.title.foreground" = "#ffffff"
"description_list.label.background" = "#1a1c20"
"description_list.label.foreground" = "#dadbdf"
"list.background" = "#0a0a0a"
"list.head.background" = "#1a1c20"
"list.even.background" = "#111214"
"list.hover.background" = "#282b30"
"list.active.background" = "#ffffff"
"list.active.border" = "#ffffff"
"table.background" = "#0a0a0a"
"table.head.background" = "#1a1c20"
"table.head.foreground" = "#a6a9ad"
"table.foot.background" = "#1a1c20"
"table.foot.foreground" = "#a6a9ad"
"table.even.background" = "#111214"
"table.hover.background" = "#282b30"
"table.active.background" = "#ffffff"
"table.active.border" = "#ffffff"
"table.row.border" = "#212327"
"tab_bar.background" = "#1a1c20"
"tab_bar.segmented.background" = "#282b30"
"tab.background" = "#1a1c20"
"tab.foreground" = "#a6a9ad"
"tab.active.background" = "#363a3f"
"tab.active.foreground" = "#ffffff"
"title_bar.background" = "#0a0a0a"
"title_bar.border" = "#212327"
"status_bar.background" = "#1a1c20"
"status_bar.border" = "#212327"
"window.border" = "#363a3f"
"scrollbar.background" = "#0a0a0a00"
"scrollbar.thumb.background" = "#555a60"
"scrollbar.thumb.hover.background" = "#a6a9ad"
"progress.bar.background" = "#ffffff"
"slider.background" = "#ffffff"
"slider.thumb.background" = "#0a0a0a"
"switch.background" = "#555a60"
"switch.thumb.background" = "#ffffff"
"skeleton.background" = "#282b30"
overlay = "#000000aa"
# The website has no status palette; these remain semantic in the desktop app.
"danger.background" = "#f17474"
"danger.foreground" = "#0a0a0a"
"danger.hover.background" = "#d95d5d"
"danger.active.background" = "#bd4b4b"
"warning.background" = "#e5b457"
"warning.foreground" = "#0a0a0a"
"warning.hover.background" = "#cc9b3f"
"warning.active.background" = "#b08432"
"success.background" = "#79c995"
"success.foreground" = "#0a0a0a"
"success.hover.background" = "#60b67e"
"success.active.background" = "#4ba06b"
"info.background" = "#a0c3ec"
"info.foreground" = "#0a0a0a"
"info.hover.background" = "#87addb"
"info.active.background" = "#7098c6"
