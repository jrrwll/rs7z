[package]
name = "rs7z"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
gpui-kit = "0.7.0"
rfd = "0.17.2"
serde = "1.0.229"
shlex = "1.3.0"
toml = "1.1.6"
tempfile = "3.27.0"
rust-i18n = "4.2.4"

[dev-dependencies]
# Independent ZIP fixtures and assertions; never linked into the application.
zip = { version = "6.0.0", default-features = false, features = ["deflate", "aes-crypto"] }
crc32fast = "1"
gpui-kit = { version = "0.7.0", features = ["test-support"] }
